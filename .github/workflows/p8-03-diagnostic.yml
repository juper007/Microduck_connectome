name: P8-03 robotd diagnostic metadata

on:
  pull_request:
    paths:
      - 'microduck_connectome/robotd_client.py'
      - 'microduck_connectome/robotd_diagnostic.py'
      - 'tests/test_robotd_client.py'
      - 'tests/test_robotd_diagnostic.py'
      - 'patches/microduck/p8-03-robotd-diagnostic-metadata.patch'
      - '.github/workflows/p8-03-diagnostic.yml'

jobs:
  python-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_robotd_client.py tests/test_robotd_diagnostic.py -q

  pinned-microduck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pollen-robotics/microduck
          ref: 344925c9f8fa031f85428a305b1e8ec2eaae29c1
          path: upstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - name: Apply pinned diagnostic patch
        run: git -C upstream apply --check ../patches/microduck/p8-03-robotd-diagnostic-metadata.patch && git -C upstream apply ../patches/microduck/p8-03-robotd-diagnostic-metadata.patch
      - run: cargo fmt --all --check
        working-directory: upstream
      - run: cargo test -p duck-ipc-proto -p robotd -p robotctl
        working-directory: upstream
