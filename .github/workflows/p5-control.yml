name: P5 decoder and safety tests

on:
  pull_request:
    paths:
      - 'config/dn_readout_v1.json'
      - 'microduck_connectome/dn_aggregator.py'
      - 'microduck_connectome/steering_decoder.py'
      - 'microduck_connectome/escape_decoder.py'
      - 'microduck_connectome/safety_clamp.py'
      - 'microduck_connectome/watchdog.py'
      - 'microduck_connectome/command_logger.py'
      - 'tests/test_dn_aggregator.py'
      - 'tests/test_steering_decoder.py'
      - 'tests/test_escape_decoder.py'
      - 'tests/test_safety_clamp.py'
      - 'tests/test_watchdog.py'
      - 'tests/test_command_logger.py'
      - '.github/workflows/p5-control.yml'

jobs:
  p5:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: P3 population readout regression
        run: python -m unittest discover -s tests -p 'test_readout.py'
      - name: P5-01 DN aggregator tests
        run: python -m unittest discover -s tests -p 'test_dn_aggregator.py'
      - name: P5-02 steering decoder tests
        run: python -m unittest discover -s tests -p 'test_steering_decoder.py'
      - name: P5-03 escape decoder tests
        run: python -m unittest discover -s tests -p 'test_escape_decoder.py'
