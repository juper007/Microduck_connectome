name: P3 runtime performance

on:
  pull_request:
    paths:
      - 'microduck_connectome/neural_model.py'
      - 'microduck_connectome/sparse_runtime.py'
      - 'microduck_connectome/stimulus.py'
      - 'microduck_connectome/readout.py'
      - 'microduck_connectome/determinism.py'
      - 'microduck_connectome/performance.py'
      - 'microduck_connectome/soak.py'
      - 'microduck_connectome/workload_identity.py'
      - 'scripts/profile_neural_runtime.py'
      - 'tests/test_neural_model.py'
      - 'tests/test_sparse_runtime.py'
      - 'tests/test_stimulus.py'
      - 'tests/test_readout.py'
      - 'tests/test_determinism.py'
      - 'tests/test_performance.py'
      - 'tests/test_soak.py'
      - 'docs/evidence/p3-06/**'
      - '.github/workflows/p3-performance.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Phase 3 focused tests
        run: |
          python -m unittest discover -s tests -p 'test_neural_model.py'
          python -m unittest discover -s tests -p 'test_sparse_runtime.py'
          python -m unittest discover -s tests -p 'test_stimulus.py'
          python -m unittest discover -s tests -p 'test_readout.py'
          python -m unittest discover -s tests -p 'test_determinism.py'
          python -m unittest discover -s tests -p 'test_performance.py'
          python -m unittest discover -s tests -p 'test_soak.py'
      - name: Latency and memory profile
        run: python scripts/profile_neural_runtime.py
